<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=Pixelify+Sans&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
</head>

<body class="contact-page">
    <nav class="navbar sticky-top navbar-expand-lg navbar-bg-contact" data-bs-theme="dark">
        <div class="navbar-bg-tiles" aria-hidden="true"></div>
        <video class="navbar-bad-apple" muted playsinline preload="none" aria-hidden="true"></video>

        <div class="container-fluid">
            <a class="navbar-brand logo" href="index.html" title="this took awfully long to animate ;(">
                <img class="logo-normal" src="img/logo.png" alt="Machine Girl logo">
                <img class="logo-hover" src="img/logo.gif" alt="" aria-hidden="true">
            </a>

            <button class="navbar-toggler navbar-toggler-contact" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto mono">
                    <li class="nav-item random-text"><a class="nav-link" href="index.html#about"><b>About Us</b></a></li>
                    <li class="nav-item random-text"><a class="nav-link" href="index.html#discography"><b>Discography</b></a></li>
                    <li class="nav-item random-text"><a class="nav-link" href="index.html#news"><b>News</b></a></li>
                    <li class="nav-item random-text"><a class="nav-link" href="index.html#events"><b>Events</b></a></li>
                </ul>
                <a class="btn my-2 my-sm-0 me-4 pixlar mg-btn" href="index.html"><b>Home</b></a>
            </div>
        </div>
    </nav>

    <div class="anything-that-aint-navbar">
        <div class="container-fluid p-0">
            <div class="hero-image-wrapper click-through">
                <img src="img/contact.png" class="user-select-none" draggable="false" alt="Contact page background">
                <div class="noise-overlay"></div>

                <div class="fillout">
                    <div class="taskbar">
                        <img src="img/setup_wiz.png" class="win-icon" alt="">
                        <p class="win-title mono unselectable">Contact Form Wizard.exe</p>
                        <button class="btn to-the-shadow-realm-btn" type="button" aria-label="Minimize window">–</button>
                        <button class="btn square-look-funny-btn" type="button" aria-label="Maximize window">☐</button>
                        <button class="btn x-btn" type="button" aria-label="Close window">X</button>
                    </div>

                    <div class="form-area">
                        <form method="post" enctype="multipart/form-data">
                            <div class="mb-3">
                                <label for="email" class="form-label unselectable">Email address</label>
                                <input type="email" class="form-control mg-fill" id="email" name="email"
                                    aria-describedby="emailHelp" autocomplete="email" required
                                    placeholder="machin3.gir1@gmail.com">
                                <div id="emailHelp" class="form-text mono unselectable">We'll never share your email with anyone else.</div>
                            </div>

                            <div class="mb-3 mail-field">
                                <label for="mailContent" class="form-label unselectable">Mail Content</label>
                                <textarea id="mailContent" name="message" class="form-control mg-fill mail-content"
                                    placeholder="Write your message here..." rows="8" maxlength="5000" required></textarea>
                                <p class="mono unselectable">max. 5000 characters</p>
                            </div>

                            <div class="mb-3 image-upload-field">
                                <label class="form-label unselectable" for="customFile">Additional Images</label>
                                <input type="file" class="form-control image-upload-input" id="customFile"
                                    name="images[]" accept="image/*" multiple>
                            </div>

                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="privacy" required>
                                <label class="form-check-label unselectable" for="privacy">
                                    By checking this box, you agree to our Privacy Policy.
                                </label>
                            </div>

                            <a href="index.html" class="btn mg-btn">Cancel</a>
                            <button type="submit" class="btn post-btn">Submit</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <footer class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between align-items-center gap-3 py-4 px-3">
            <div class="footer-left unselectable">© 2026 Machine Girl. All rights reserved. Built with love in Winterthur.</div>
            <div class="footer-right d-flex flex-wrap align-items-center justify-content-center justify-content-md-end gap-3">
                <a class="link-contact" href="dummy.html">Privacy Policy</a>
                <span>•</span>
                <a class="link-contact" href="dummy.html">Terms of Use</a>
                <span>•</span>
                <a class="link-contact" href="dummy.html">Cookie Settings</a>
            </div>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
